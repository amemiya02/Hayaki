name: 🛠️ Code Quality Checks

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_TOOL_OPTIONS: -Dkotlin.daemon.options=autoshutdownIdleSeconds=10

jobs:
  lintKotlin:
    name: Lint Kotlin
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - name: Configure JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: "jetbrains"
          java-version: "21"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        timeout-minutes: 5
        with:
          cache-provider: basic
          # Only main writes the cache, so branches don't evict it
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # Reject versionCode decreases and increases over 100,000.
      - name: Validate versionCode
        env:
          VERSION_CODE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: tools/validate-version-code.sh "$VERSION_CODE_BASE"

      # "lintAll" lints every module in one flavor, pinning :AnkiDroid to lintFullDebug
      # update workflows/README.md when modifying this line
      - name: Run Lint
        run: ./gradlew lintAll ktlintCheck --daemon
