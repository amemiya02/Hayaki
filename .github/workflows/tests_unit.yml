name: 🛠️ Unit Tests

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_TOOL_OPTIONS: -Dkotlin.daemon.options=autoshutdownIdleSeconds=10

jobs:
  unit:
    name: JUnit Tests
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      # Work around Ubuntu 26.04's RAM-backed /tmp until the image fix rolls out.
      # https://github.com/actions/runner-images/pull/14814
      - name: Keep /tmp on disk
        run: |
          if [ "$(findmnt -n -o FSTYPE --target /tmp)" = "tmpfs" ]; then
            sudo systemctl mask tmp.mount
            sudo umount -l /tmp
          fi

      - name: Configure Linux Swap
        run: |
          sudo fallocate -l 8G /swapfile-ci
          sudo chmod 600 /swapfile-ci
          sudo mkswap /swapfile-ci
          sudo swapon /swapfile-ci

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: "jetbrains"
          java-version: "21"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        timeout-minutes: 10
        with:
          # Gradle User Home is cached by the steps around it, not by this action
          cache-provider: external

      # The basic provider matches only exact keys, and shares its key with lint.yml.
      # A versionCode bump then started from an empty cache, and lint's entry never
      # held the Robolectric jars, so Maven Central answered the re-download with 429.
      # A key of our own with restore keys keeps those jars across build file edits.
      - name: Restore Gradle User Home
        id: gradle-home
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-unit-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle/*.versions.toml', 'buildSrc/**') }}
          restore-keys: gradle-unit-${{ runner.os }}-

      - name: Gradle Dependency Download
        id: gradle-deps
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          timeout_minutes: 15
          # Maven Central answers bursts with 429 Too Many Requests: back off for longer
          retry_wait_seconds: 180
          max_attempts: 5
          command: ./gradlew robolectricSdkDownload --daemon

      # update workflows/README.md when modifying this step
      - name: Run Unit Tests
        run: ./gradlew jacocoUnitTestReport --daemon

      - name: Report Unit Test Results
        if: always() && hashFiles('**/build/test-results/**/TEST-*.xml') != ''
        run: python3 .github/report_test_failures.py . --pattern "build/test-results/**/TEST-*.xml" --title "Unit test failures"

      - name: Store Test Results
        if: failure() || cancelled()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unit-test-results
          path: "**/build/test-results/"

      # Only main writes the cache, so branches don't evict it. Save once the
      # dependencies are complete, even if tests fail, and never over an exact hit.
      - name: Stop Gradle Daemons
        if: >-
          always() && github.ref == 'refs/heads/main'
          && steps.gradle-deps.outcome == 'success'
          && steps.gradle-home.outputs.cache-hit != 'true'
        run: ./gradlew --stop

      - name: Save Gradle User Home
        if: >-
          always() && github.ref == 'refs/heads/main'
          && steps.gradle-deps.outcome == 'success'
          && steps.gradle-home.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ steps.gradle-home.outputs.cache-primary-key }}
